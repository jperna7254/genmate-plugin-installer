# Runs on every ticket's PR into develop and on each merge there, and on the release PR to main, whose merge may
# publish a release (build-release-prod.yml). Builds the app too, since the tests reference only Core.
name: Build and Test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: [self-hosted, genmate-installer]

    steps:
    # Git for Windows on the CI machine checks files out with CRLF; the line's files and tests expect LF,
    # as the laptop checks them out (core.autocrlf false). Files a CRLF checkout left are cleared once,
    # as checking out a new commit rewrites only the files it changes.
    - name: Check out with LF line endings
      run: |
        if ((git config --global core.autocrlf) -ne 'false') {
          git config --global core.autocrlf false
          Get-ChildItem -Force $env:GITHUB_WORKSPACE | Remove-Item -Recurse -Force
        }
    - uses: actions/checkout@v6

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      # The runner's account cannot write Program Files, setup-dotnet's default; the runner's own
      # tool cache keeps the SDK between runs.
      env:
        DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Build
      run: dotnet build GenMate.PluginInstaller.csproj -c Release

    - name: Test
      run: dotnet test Tests/GenMate.PluginInstaller.Tests.csproj -c Release

  # line.toml names this job's check run as the line's lint. Whitespace only, by the merger's choice: style and analyzer
  # rules do not fail a PR. --folder needs no restore or build, so the WPF app is checked as a Linux ticket container
  # checks it; bin and obj are left out for a local run after a build.
  lint:
    runs-on: [self-hosted, genmate-installer]

    steps:
    # Git for Windows on the CI machine checks files out with CRLF; the line's files and tests expect LF,
    # as the laptop checks them out (core.autocrlf false). Files a CRLF checkout left are cleared once,
    # as checking out a new commit rewrites only the files it changes.
    - name: Check out with LF line endings
      run: |
        if ((git config --global core.autocrlf) -ne 'false') {
          git config --global core.autocrlf false
          Get-ChildItem -Force $env:GITHUB_WORKSPACE | Remove-Item -Recurse -Force
        }
    - uses: actions/checkout@v6

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      # The runner's account cannot write Program Files, setup-dotnet's default; the runner's own
      # tool cache keeps the SDK between runs.
      env:
        DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
      with:
        dotnet-version: '10.0.x'

    - name: Check formatting
      run: dotnet format whitespace --folder --verify-no-changes --exclude bin obj Core/bin Core/obj Tests/bin Tests/obj
