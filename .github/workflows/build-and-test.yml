# The check a PR to main must pass before its merge, which may publish a release
# (build-release-prod.yml). Builds the app too, since the tests reference only Core.
name: Build and Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Build
      run: dotnet build GenMate.PluginInstaller.csproj -c Release

    - name: Test
      run: dotnet test Tests/GenMate.PluginInstaller.Tests.csproj -c Release
